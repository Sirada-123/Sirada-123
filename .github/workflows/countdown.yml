name: Update 2026 Countdown

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Generate countdown SVG
        run: |
          python3 <<'PY'
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          target = datetime(2027, 1, 1, 0, 0, 0, tzinfo=timezone.utc)

          remaining = max(0, int((target - now).total_seconds()))

          days = remaining // 86400
          hours = (remaining % 86400) // 3600

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="600"
          height="160"
          viewBox="0 0 600 160">

            <rect width="600" height="160" rx="16" fill="#0d1117"/>

            <text
              x="300"
              y="42"
              text-anchor="middle"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="14"
              font-weight="600"
              letter-spacing="2">
              TIME LEFT IN 2026
            </text>

            <text
              x="300"
              y="92"
              text-anchor="middle"
              fill="#ffffff"
              font-family="monospace"
              font-size="32"
              font-weight="700">
              {days} DAYS · {hours} HOURS
            </text>

            <text
              x="300"
              y="125"
              text-anchor="middle"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="13">
              until 2027 🚀
            </text>

          </svg>'''

          with open("countdown.svg", "w") as f:
              f.write(svg)

          print(f"Countdown: {days} days, {hours} hours")
          PY

      - name: Update countdown.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w 0 countdown.svg)

          SHA=$(gh api \
            repos/${{ github.repository }}/contents/countdown.svg \
            --jq '.sha' 2>/dev/null || true)

          if [ -n "$SHA" ]; then
            gh api \
              --method PUT \
              repos/${{ github.repository }}/contents/countdown.svg \
              -f message="chore: update countdown" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api \
              --method PUT \
              repos/${{ github.repository }}/contents/countdown.svg \
              -f message="chore: create countdown" \
              -f content="$CONTENT"
          fi
